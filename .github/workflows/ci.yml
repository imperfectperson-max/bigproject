name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # Detection job - checks which language/tooling files are present
  detect:
    name: Detect Languages
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_java: ${{ steps.detect.outputs.has_java }}
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_eslint: ${{ steps.detect.outputs.has_eslint }}
      has_python_lint: ${{ steps.detect.outputs.has_python_lint }}
      java_build_tool: ${{ steps.detect.outputs.java_build_tool }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect language files
        id: detect
        run: |
          # Detect Node.js
          if [ -f "package.json" ]; then
            echo "has_node=true" >> $GITHUB_OUTPUT
            echo "✓ Detected Node.js (package.json found)"
          else
            echo "has_node=false" >> $GITHUB_OUTPUT
            echo "✗ No Node.js detected"
          fi

          # Detect Python
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || find . -name "*.py" -type f | grep -q .; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "✓ Detected Python files"
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
            echo "✗ No Python detected"
          fi

          # Detect Go
          if [ -f "go.mod" ]; then
            echo "has_go=true" >> $GITHUB_OUTPUT
            echo "✓ Detected Go (go.mod found)"
          else
            echo "has_go=false" >> $GITHUB_OUTPUT
            echo "✗ No Go detected"
          fi

          # Detect Java (Maven or Gradle)
          if [ -f "pom.xml" ]; then
            echo "has_java=true" >> $GITHUB_OUTPUT
            echo "java_build_tool=maven" >> $GITHUB_OUTPUT
            echo "✓ Detected Java with Maven (pom.xml found)"
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "has_java=true" >> $GITHUB_OUTPUT
            echo "java_build_tool=gradle" >> $GITHUB_OUTPUT
            echo "✓ Detected Java with Gradle (build.gradle found)"
          else
            echo "has_java=false" >> $GITHUB_OUTPUT
            echo "java_build_tool=none" >> $GITHUB_OUTPUT
            echo "✗ No Java detected"
          fi

          # Detect Rust
          if [ -f "Cargo.toml" ]; then
            echo "has_rust=true" >> $GITHUB_OUTPUT
            echo "✓ Detected Rust (Cargo.toml found)"
          else
            echo "has_rust=false" >> $GITHUB_OUTPUT
            echo "✗ No Rust detected"
          fi

          # Detect ESLint config
          if [ -f ".eslintrc" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.yml" ] || [ -f "eslint.config.js" ] || grep -q "eslintConfig" package.json 2>/dev/null; then
            echo "has_eslint=true" >> $GITHUB_OUTPUT
            echo "✓ Detected ESLint configuration"
          else
            echo "has_eslint=false" >> $GITHUB_OUTPUT
          fi

          # Detect Python linting configs
          if [ -f ".flake8" ] || [ -f "pyproject.toml" ] || [ -f "ruff.toml" ] || [ -f ".ruff.toml" ]; then
            echo "has_python_lint=true" >> $GITHUB_OUTPUT
            echo "✓ Detected Python linting configuration"
          else
            echo "has_python_lint=false" >> $GITHUB_OUTPUT
          fi

  # Node.js job - runs only if Node.js is detected
  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    strategy:
      matrix:
        node-version: [16, 18, 20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test

      - name: Run ESLint
        if: needs.detect.outputs.has_eslint == 'true'
        run: |
          if npm list eslint --depth=0 > /dev/null 2>&1; then
            npm run lint || npx eslint .
          fi
        continue-on-error: false

  # Python job - runs only if Python is detected
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "pyproject.toml" ]; then
            if grep -q "\[project\]" pyproject.toml || grep -q "\[tool.poetry\]" pyproject.toml; then
              pip install -e .[dev] 2>/dev/null || pip install -e . || echo "No installable package"
            fi
          fi
          # Install pytest if not already installed
          pip install pytest 2>/dev/null || true

      - name: Run syntax check
        run: |
          # Basic syntax validation for all Python files
          python -m py_compile $(find . -name "*.py" -not -path "*/\.*" | head -20) || echo "Some files have syntax errors"

      - name: Run tests
        run: |
          if [ -d "tests" ] || [ -d "test" ]; then
            pytest -q || python -m pytest -q || echo "No tests found or pytest not configured"
          else
            echo "No test directory found, skipping tests"
          fi
        continue-on-error: true

  # Python linting job - runs only if Python linting config is detected
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_python_lint == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          if [ -f ".flake8" ]; then
            pip install flake8
          fi
          if [ -f "pyproject.toml" ] && grep -q "tool.ruff" pyproject.toml; then
            pip install ruff
          fi

      - name: Run flake8
        if: hashFiles('.flake8') != ''
        run: flake8 .
        continue-on-error: true

      - name: Run ruff
        if: hashFiles('pyproject.toml') != '' || hashFiles('ruff.toml') != ''
        run: ruff check .
        continue-on-error: true

  # Go job - runs only if Go is detected
  go:
    name: Go
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: go test ./... -v

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        if: hashFiles('.golangci.yml') != '' || hashFiles('.golangci.yaml') != ''
        continue-on-error: true

  # Java Maven job - runs only if Maven is detected
  java-maven:
    name: Java (Maven) - JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_java == 'true' && needs.detect.outputs.java_build_tool == 'maven'
    strategy:
      matrix:
        java-version: [11, 17]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with Maven
        run: mvn -B -DskipTests=false test

  # Java Gradle job - runs only if Gradle is detected
  java-gradle:
    name: Java (Gradle) - JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_java == 'true' && needs.detect.outputs.java_build_tool == 'gradle'
    strategy:
      matrix:
        java-version: [11, 17]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew
        if: hashFiles('gradlew') != ''

      - name: Run tests with Gradle
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew test
          else
            gradle test
          fi

  # Rust job - runs only if Rust is detected
  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all

      - name: Run cargo fmt check
        run: cargo fmt -- --check
        continue-on-error: true

      - name: Run clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true
